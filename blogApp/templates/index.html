<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
      }

      /* Navbar */
      .navbar {
        background: #222;
        color: white;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h2 {
        color: #00adb5;
      }

      .nav-buttons button {
        margin-left: 10px;
        padding: 8px 15px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      .login-btn {
        background: #00adb5;
        color: white;
      }

      .signup-btn {
        background: #ff5722;
        color: white;
      }

      /* Main */
      .container {
        padding: 30px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .create-btn {
        padding: 10px 20px;
        background: #00adb5;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      /* Blog Cards */
      .blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }

      .blog-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .blog-card h3 {
        margin-bottom: 10px;
      }

      .blog-card p {
        color: #555;
        margin-bottom: 15px;
      }

      /* Buttons inside card */
      .card-buttons {
        display: flex;
        justify-content: space-between;
      }

      .card-buttons button {
        border: none;
        padding: 7px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
      }

      .read-btn {
        background: #2196f3;
        color: white;
      }

      .edit-btn {
        background: #ffc107;
      }

      .delete-btn {
        background: #f44336;
        color: white;
      }

      .like-btn {
        background: #e91e63;
        color: white;
      }

      .share-btn {
        background: #4caf50;
        color: white;
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background: white;
        margin: 10% auto;
        padding: 20px;
        width: 350px;
        border-radius: 10px;
        text-align: center;
      }

      .modal-content input,
      .modal-content textarea {
        width: 100%;
        margin: 10px 0;
        padding: 8px;
      }

      .modal-content button {
        padding: 10px;
        background: #00adb5;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      .close-btn {
        float: right;
        font-size: 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div class="navbar">
      <h2>BlogSpace</h2>
      {% if is_logedin %}
      <div class="nav-buttons">
        <button class="signup-btn" onclick="logout()">Logout</button>
      </div>
      {% else %}
      <div class="nav-buttons">
        <button class="login-btn">Login</button>
        <button class="signup-btn">Signup</button>
      </div>
      {% endif %}
    </div>

    <!-- Main Content -->
    <div class="container">
      <div class="top-bar">
        <h2>Latest Blogs</h2>
        <button class="create-btn" onclick="openModal()">+ Create Post</button>
      </div>

      <div class="blog-grid" id="blogGrid">
        <!-- Blog Card -->
        <div class="blog-grid">
          {% for post in posts %}
          <div class="blog-card">
            <h3>{{ post.user_id.uname }}</h3>
            <h3>{{ post.id }}</h3>
            <h3>{{ post.title }}</h3>
            <p>{{ post.content }}</p>
            <input type="hidden" id="csrfToken" value="{{ csrf_token }}" />
            <button
              onclick="deletePost('{{ post.id }}')"
              class="delete-btn"
              style="cursor: pointer"
            >
              Delete
            </button>
            <button
              class="edit-btn"
              onclick="openEditModal('{{ post.id }}', '{{ post.title }}', `{{ post.content }}`)"
            >
              Edit
            </button>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div id="blogModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2>Create Blog</h2>

        <form method="POST" action="{% url 'add_blog' %}">
          {% csrf_token %}

          <input
            type="text"
            name="title"
            placeholder="Enter Blog Title"
            required
          />
          <textarea
            name="content"
            placeholder="Enter Blog Content"
            required
          ></textarea>

          <button type="submit">Post Blog</button>
        </form>
      </div>
    </div>

    <!-- edit modal -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeEditModal()">&times;</span>
        <h2>Edit Blog</h2>

        <input type="hidden" id="editId" />

        <input type="text" id="editTitle" placeholder="Title" />
        <textarea id="editContent" placeholder="Content"></textarea>

        <button onclick="updatePost()">Update</button>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      // edit modal
      // OPEN MODAL + PREFILL
      function openEditModal(id, title, content) {
        document.getElementById("editModal").style.display = "block";

        document.getElementById("editId").value = id;
        document.getElementById("editTitle").value = title;
        document.getElementById("editContent").value = content;
      }

      // CLOSE MODAL
      function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
      }

      // UPDATE POST
      function updatePost() {
        let id = document.getElementById("editId").value;
        let title = document.getElementById("editTitle").value;
        let content = document.getElementById("editContent").value;
        let csrfToken = document.getElementById("csrfToken").value;

        fetch(`/api/edit/${id}/`, {
          method: "POST",
          headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: `title=${encodeURIComponent(title)}&content=${encodeURIComponent(content)}`,
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              location.reload(); // or update UI dynamically
            } else {
              alert("Update failed");
            }
          });
      }

      function deletePost(id) {
        const csrfToken = document.getElementById("csrfToken").value;

        fetch(`/api/delete/${id}/`, {
          method: "POST",
          headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/json",
          },
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              location.reload();
            } else {
              alert("Delete failed");
            }
          });
      }
      function openModal() {
        document.getElementById("blogModal").style.display = "block";
      }

      function closeModal() {
        document.getElementById("blogModal").style.display = "none";
      }

      function addBlog() {
        let title = document.getElementById("title").value;
        let content = document.getElementById("content").value;

        if (title === "" || content === "") {
          alert("Please fill all fields");
          return;
        }

        let blogGrid = document.getElementById("blogGrid");

        let newBlog = `
                <div class="blog-card">
                    <h3>${title}</h3>
                    <p>${content}</p>
                    <div class="card-buttons">
                        <button class="read-btn">Read</button>
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn" onclick="this.closest('.blog-card').remove()">Delete</button>
                    </div>
                    <br>
                    <div class="card-buttons">
                        <button class="like-btn">❤️ Like</button>
                        <button class="share-btn">Share</button>
                    </div>
                </div>
            `;

        blogGrid.innerHTML += newBlog;

        // Clear inputs
        document.getElementById("title").value = "";
        document.getElementById("content").value = "";

        closeModal();
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        let modal = document.getElementById("blogModal");
        if (event.target === modal) {
          modal.style.display = "none";
        }
      };

      function logout() {
        fetch("/api/logout/", {
          method: "POST",
          headers: {
            "X-CSRFToken": "{{ csrf_token }}",
          },
        }).then((response) => {
          if (response.ok) {
            location.reload();
            window.location.href = "/api/login/"; // Redirect after success
          }
        });
      }
    </script>
  </body>
</html>
